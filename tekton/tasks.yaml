apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: tax-calculator-unit-test
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/categories: Testing
    tekton.dev/tags: "test, nodejs, jasmine"
    tekton.dev/displayName: "Tax Calculator Jasmine Unit Test"
spec:
  description: >-
    Clones source workspace, installs dependencies, and runs Jasmine automated unit tests for Tax Calculator.
  workspaces:
    - name: source
      description: The git repository containing the Tax Calculator code.
  steps:
    - name: test-runner
      image: node:20-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        echo "=== Running Tax Calculator Automated Jasmine Unit Tests ==="
        npm install
        npx jasmine
        echo "=== All Jasmine Unit Tests Passed Successfully! ==="
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: tax-calculator-build-image
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/categories: Build
    tekton.dev/tags: "docker, build, icr"
    tekton.dev/displayName: "Build and Push Tax Calculator Image"
spec:
  description: >-
    Builds the Tax Calculator Docker container image and pushes it to IBM Cloud Container Registry.
  params:
    - name: IMAGE
      type: string
      description: The destination image URL in IBM Cloud Registry (e.g. icr.io/namespace/tax-calculator:latest)
    - name: DOCKERFILE
      type: string
      description: Path to the Dockerfile
      default: ./Dockerfile
    - name: CONTEXT
      type: string
      description: Build context path
      default: .
  workspaces:
    - name: source
      description: Git repository workspace
  steps:
    - name: build-and-push
      image: gcr.io/kaniko-project/executor:v1.14.0-debug
      workingDir: $(workspaces.source.path)
      command:
        - /kaniko/executor
      args:
        - --dockerfile=$(params.DOCKERFILE)
        - --context=$(workspaces.source.path)/$(params.CONTEXT)
        - --destination=$(params.IMAGE)
        - --skip-tls-verify
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: tax-calculator-deploy
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/categories: Deployment
    tekton.dev/tags: "kubernetes, deploy"
    tekton.dev/displayName: "Deploy Tax Calculator to Cluster"
spec:
  description: >-
    Applies the Kubernetes deployment and service manifests to deploy the Tax Calculator web app.
  params:
    - name: MANIFEST_DIR
      type: string
      description: Directory containing deployment and service manifests
      default: deploy
  workspaces:
    - name: source
      description: Git repository workspace
  steps:
    - name: kubectl-deploy
      image: bitnami/kubectl:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        echo "=== Deploying Tax Calculator to Kubernetes / IBM Cloud ==="
        kubectl apply -f $(params.MANIFEST_DIR)/
        echo "=== Checking Rollout Status ==="
        kubectl rollout status deployment/tax-calculator-deployment --timeout=120s
        echo "=== Tax Calculator Deployed Successfully! ==="
